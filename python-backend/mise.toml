[tools]
python = "3.12"
uv = "0.12"

[tasks.setup]
description = "Create .env from .env.example if it is missing"
hide = true
run = "test -f .env || cp .env.example .env"

[tasks.install]
description = "Sync Python dependencies into .venv"
run = "uv sync"

[tasks.serve]
description = "Run the Waller backend API (FastAPI). Reload with `mise watch serve --restart`"
depends = ["install", "setup"]
env = { _.file = ".env" }
run = 'uv run fastapi run --host "${HOST:-127.0.0.1}" --port "${PORT:-8000}"'
sources = ["**/*.py"]
# Never skip this long-running task when sources are unchanged
outputs = []

[tasks.test]
description = "Run pytest suite"
depends = ["install"]
run = "uv run pytest"
