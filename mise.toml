monorepo_root = true

[monorepo]
config_roots = ["python-backend", "react-frontend"]

[tools]
watchexec = "latest"

[tasks.serve]
description = "Run the backend API and frontend together. `mise watch serve --restart` restarts both when files change"
depends = ["//python-backend:serve", "//react-frontend:serve"]

[tasks.install]
description = "Install dependencies in every project"
depends = ["//python-backend:install", "//react-frontend:install"]

[tasks.test]
description = "Run tests in every project"
depends = ["//python-backend:test"]
