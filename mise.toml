monorepo_root = true

[monorepo]
config_roots = ["python-backend", "react-frontend"]

[tasks.serve]
description = "Run the backend API and frontend dev server together. Use `mise watch serve --restart` for auto-reload"
depends = ["//python-backend:serve", "//react-frontend:dev"]

[tasks.install]
description = "Install dependencies in every project"
depends = ["//python-backend:install", "//react-frontend:install"]

[tasks.test]
description = "Run tests in every project"
depends = ["//python-backend:test"]
